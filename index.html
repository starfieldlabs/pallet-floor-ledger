<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Pallet Floor Ledger</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="appbar">
    <div class="topbar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="3" y="7" width="26" height="4" rx="1"/>
          <rect x="3" y="13" width="26" height="4" rx="1"/>
          <rect x="4" y="19" width="5" height="6" rx="1"/>
          <rect x="13.5" y="19" width="5" height="6" rx="1"/>
          <rect x="23" y="19" width="5" height="6" rx="1"/>
        </svg>
        <div>
          <div id="shop-name" class="shop"></div>
          <div class="product">Pallet Floor Ledger</div>
        </div>
      </div>
      <div class="lang" id="lang-group" role="group">
        <button type="button" data-action="lang" data-lang="en">EN</button>
        <button type="button" data-action="lang" data-lang="es">ES</button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>

  <main>
    <div id="banner"></div>
    <div id="view"></div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">Pallet Floor Ledger needs JavaScript turned on.</p></noscript>

  <script src="js/payroll.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/store.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
